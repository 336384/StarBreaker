name: App Artifacts

# Manual-only: this runs a release-mode Tauri build which is much slower than
# the debug `cargo test` in ci.yml. Trigger from the Actions tab when you
# actually need a downloadable portable .exe for a specific commit.
on:
  workflow_dispatch:

jobs:
  build-app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Read-only cache: reuse whatever release.yml last warmed under
      # `cache-${{ platform }}` but never write back, so ad-hoc dispatches
      # can't evict the release cache.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          shared-key: cache-windows-latest
          save-if: false
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (portable)
         run: npx tauri build --no-bundle --no-sign
        env:
          COMMIT_SHA: ${{ github.sha }}

      # The binary name depends on Tauri's mainBinaryName handling
      # (`starbreaker-app.exe` vs `StarBreaker.exe`), so list what was produced
      # and upload by glob instead of hard-coding one file name.
      - name: List built executables
        run: Get-ChildItem src-tauri/target/release/*.exe | Select-Object Name, Length

      - name: Upload portable executable
        uses: actions/upload-artifact@v7
        with:
          name: starbreaker-zh-CN
          path: app/src-tauri/target/release/*.exe
          if-no-files-found: error
# restore workflow registration
