name: App Artifacts

# Manual-only: this runs a release-mode Tauri build which is much slower than
# the debug `cargo test` in ci.yml. Trigger from the Actions tab when you
# actually need a downloadable portable .exe for a specific commit.
on:
  workflow_dispatch:

jobs:
  build-app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # `app/src-tauri` is a member of the root Cargo workspace, so cargo writes
      # its artifacts to <repo>/target. Cache that directory, and allow the
      # first successful run to warm it (a fork has no pre-existing cache).
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: cache-windows-latest
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      # Tauri 2's CLI only accepts real bundle targets for `--bundles`
      # (msi/nsis on Windows); `--bundles none` is rejected, so use the
      # dedicated `--no-bundle` flag to get a portable executable.
      - name: Build Tauri app (portable)
        run: npx tauri build --no-bundle --no-sign
        env:
          COMMIT_SHA: ${{ github.sha }}

      # The binary lands in the workspace-root target dir, not in
      # app/src-tauri/target. Its name depends on Tauri's mainBinaryName
      # handling (`starbreaker-app.exe` vs `StarBreaker.exe`), hence the glob.
      - name: List built executables
        run: |
          foreach ($dir in @("../target/release", "src-tauri/target/release")) {
            Write-Host "== $dir =="
            if (Test-Path $dir) { Get-ChildItem $dir/*.exe | Select-Object Name, Length }
            else { Write-Host "(missing)" }
          }

      - name: Upload portable executable
        uses: actions/upload-artifact@v7
        with:
          name: starbreaker-zh-CN
          path: |
            target/release/*.exe
            app/src-tauri/target/release/*.exe
          if-no-files-found: error
